name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: Test (vitest)
        run: npm test

      - name: Build (fails on content-pipeline guardrails)
        run: npm run build
