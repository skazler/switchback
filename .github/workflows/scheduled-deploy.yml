# Rebuild + redeploy on a timer.
#
# The site is fully prerendered, so anything date-dependent is baked in at build
# time. The pages that show "today" recompute it client-side on hydration (see
# src/routes/route/[day]/+page.svelte), which keeps them CORRECT — but the static
# HTML served before hydration still carries the build day's week number and
# "today" badge. Rebuilding daily keeps that pre-hydration fallback fresh too.
#
# Daily rather than weekly because the "today" badge moves every day, not just
# the week number. 08:00 UTC = 02:00/03:00 America/Chicago, i.e. safely after
# local midnight in both CST and CDT, so the build day matches the calendar day
# the site is resolving against.
#
# Requires two repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit) and
# CLOUDFLARE_ACCOUNT_ID. Deploys the same way DEPLOY.md does by hand —
# Direct Upload to the `main` (production) branch of the `switchback` project.

name: Scheduled deploy

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# Never let two deploys race; a queued run is pointless once a newer one starts.
concurrency:
  group: scheduled-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name switchback --branch main
